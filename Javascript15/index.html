<!DOCTYPE html>
<html>
    <head>
        <title>Javascript query selector</title>
    </head>
    <body>
        <nav class="block">
            <p class="paragraph">Welecome to my website</p>
        </nav>

        <div class="block">
            <p id="username">This is my blog para</p>
        </div>

        <script>
            const elements = document.getElementsByClassName("block");
         for(let i = 0; i <elements.length; i++){
            elements.item(i).style.background = "blue";
         }        </script>
    </body>
</html>
